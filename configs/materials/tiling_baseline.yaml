        - 5.0
    missing:
    - Wet density
    - Flow and yield curves versus age and working
    - Residue adhesion, sponge uptake and wash-out coefficients
baseline:
  temperature_c: 21.0
  relative_humidity: 0.5
  environment_effects: Held fixed. No claimed calibrated temperature/humidity kinetics.
  tile_mass_method: uniform_envelope_volume_times_assumed_density
  simulation_strength_policy: No fracture threshold inferred from ASTM C648. Damage
    remains unmodeled until a separate declared constitutive model exists.
  panel_rows: 2
  panel_columns: 2
  placement_error_tolerance_m: 0.002
  adhesive_wet_bed_height_m: 0.006
  nominal_bedded_gap_m: 0.003
