<dialog id="appearance-settings" aria-labelledby="appearance-title"><div class="appearance-heading"><h2 id="appearance-title">Customize appearance</h2><button type="button" class="secondary" onclick="document.getElementById('appearance-settings').close()" aria-label="Close appearance settings">×</button></div><p class="small">Choose a palette for each mode. Changes preview instantly and are remembered in this browser.</p><div class="appearance-modes" role="group" aria-label="Appearance mode"><button type="button" data-appearance-mode="light" onclick="changeAppearanceMode('light')">Light</button><button type="button" data-appearance-mode="dark" onclick="changeAppearanceMode('dark')">Dark</button><button type="button" data-appearance-mode="auto" onclick="changeAppearanceMode('auto')">Auto</button></div><label class="field">Light mode palette<select id="light-palette" onchange="choosePalette('light',this.value)"><optgroup label="Light palettes"><option value="porcelain">Porcelain · ivory / forest</option><option value="cobalt">Cobalt · white / blue</option></optgroup><optgroup label="Dark palettes"><option value="graphite">Graphite · charcoal / amber</option><option value="midnight">Midnight · navy / blue</option><option value="sage">Sage · charcoal / green</option></optgroup></select></label><label class="field">Dark mode palette<select id="dark-palette" onchange="choosePalette('dark',this.value)"><optgroup label="Light palettes"><option value="porcelain">Porcelain · ivory / forest</option><option value="cobalt">Cobalt · white / blue</option></optgroup><optgroup label="Dark palettes"><option value="graphite">Graphite · charcoal / amber</option><option value="midnight">Midnight · navy / blue</option><option value="sage">Sage · charcoal / green</option></optgroup></select></label><div class="appearance-schedule"><h3>Auto schedule</h3><p class="small">Follows this device’s local clock, including its time zone.</p><label class="field">Switch to light<input id="light-start" type="time" value="07:00" required onchange="changeAppearanceSchedule()"></label><label class="field">Switch to dark<input id="dark-start" type="time" value="19:00" required onchange="changeAppearanceSchedule()"></label><p class="small appearance-error" id="appearance-error" role="alert"></p></div><p class="small" id="appearance-clock" role="status"></p><div class="buttons"><button type="button" class="primary" onclick="finishAppearanceSettings()">Done</button></div></dialog>
